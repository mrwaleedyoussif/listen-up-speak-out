<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>From Zero To Hero (English Language)</title>
<meta name="description" content="From Zero To Hero (English Language) — Andalus International Schools, Taif Boys: Listening and Speaking (Levels 2–5), Shadowing and MAP test practice (Grades 3–9), with Arabic support. Designed by Waleed Youssef.">
<meta name="theme-color" content="#2E3074">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zero To Hero">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --ink:#1D2433; --ink2:#4B5568; --muted:#7A8499; --line:#E3E7F0; --bg:#F5F7FC; --card:#FFFFFF;
  --coral:#E0566F; --coral-d:#BE3F58; --sun:#F2B330; --ok:#1FA463; --ok-l:#E2F7EC; --bad:#E5484D; --bad-l:#FDECEC;
  --c:#2E3074; --cl:#E8E9F7; --cd:#1F2052;
  --r:18px; --sh:0 6px 20px rgba(29,36,51,.08); --sh2:0 2px 8px rgba(29,36,51,.06);
  --fh:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --fb:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --fa:"Tajawal","Segoe UI","Geeza Pro","Arial",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--fb);color:var(--ink);background:var(--bg);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.classmode{font-size:20px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--fh);margin:0;line-height:1.15;letter-spacing:-.01em}
.ar{font-family:var(--fa);direction:rtl;text-align:right;unicode-bidi:isolate;color:#3D4A63;font-size:.95em;line-height:1.7}
.ar-block{display:block;margin-top:.35rem}
.noar .ar{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 60px}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:9px 18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fh);font-weight:800;font-size:1.15rem;color:var(--ink)}
.brand svg{width:38px;height:38px;flex:none}
.brand small{display:block;font-family:var(--fb);font-weight:600;font-size:.72rem;color:var(--muted);letter-spacing:.02em;margin-top:-3px}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-weight:700;font-size:.88rem;white-space:nowrap}
.chip.on{background:var(--cl);border-color:var(--c);color:var(--cd)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);font-size:1.15rem}
.iconbtn:hover,.chip:hover{border-color:var(--c)}

/* generic */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:800;background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-d);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--coral-d)}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.band{background:var(--c);box-shadow:0 4px 0 var(--cd)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 #157a48}
.btn.sm{padding:8px 13px;font-size:.9rem;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--cl);color:var(--cd);font-weight:800;font-size:.78rem;letter-spacing:.02em}
.stars{color:var(--sun);letter-spacing:2px;font-size:1.05rem;white-space:nowrap}
.stars .off{color:#D9DEE8}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:18px 0 10px;font-weight:700;font-size:.9rem}
.crumbs button{color:var(--c)}
.crumbs span{color:var(--muted)}
.section-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.section-title h2{font-size:1.5rem}

/* hero */
.hero{margin-top:18px;border-radius:26px;padding:28px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(120deg,#2F7BEA 0%,#6A4CE0 55%,#FF6B4A 120%)}
.hero h1{font-size:clamp(2rem,4.6vw,3.1rem);font-weight:800}
.hero p{margin:.4rem 0 0;font-size:1.05rem;opacity:.95;max-width:620px}
.hero .bubbles{position:absolute;right:-30px;top:-30px;width:260px;opacity:.18}
.profiles{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.prof{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:#fff;border:2px solid var(--line);font-weight:800}
.prof .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
.prof.cur{border-color:var(--ok);background:var(--ok-l)}
input[type=text]{font:inherit;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;min-width:0}
input[type=text]:focus{border-color:var(--c);outline:none}

/* grade cards */
.gcard{border-radius:22px;padding:20px;color:#fff;position:relative;overflow:hidden;text-align:left;min-height:178px;display:flex;flex-direction:column;box-shadow:var(--sh)}
.gcard h3{font-size:1.7rem}
.gcard .lv{font-weight:800;opacity:.92}
.gcard .em{position:absolute;right:14px;top:8px;font-size:3.4rem;opacity:.9}
.gcard .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.3);margin-top:auto}
.gcard .bar i{display:block;height:100%;border-radius:99px;background:#fff}
.gcard .meta{font-size:.85rem;font-weight:700;margin-top:6px;opacity:.95}

/* unit cards */
.ucard{display:flex;flex-direction:column;gap:8px;text-align:left;border:2px solid transparent}
.ucard:hover{border-color:var(--c)}
.ucard .uh{display:flex;gap:12px;align-items:center}
.ucard .ue{width:54px;height:54px;border-radius:16px;background:var(--cl);display:grid;place-items:center;font-size:1.8rem;flex:none}
.ucard h3{font-size:1.2rem}
.lesson-list{display:grid;gap:10px}
.lrow{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:15px;background:#fff;border:2px solid var(--line);text-align:left;width:100%}
.lrow:hover{border-color:var(--c)}
.lrow .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;flex:none;background:var(--cl)}
.lrow .tx{flex:1;min-width:0}
.lrow .tx b{display:block;font-size:1.02rem}
.lrow .tx small{color:var(--muted);font-weight:600}
.lrow.done{border-color:#BDE8D0;background:#FAFFFC}

/* lesson shell */
.lhead{border-radius:22px;padding:20px 22px;background:var(--c);color:#fff;margin-top:6px}
.lhead h1{font-size:clamp(1.5rem,3.5vw,2.1rem)}
.lhead .k{font-weight:800;opacity:.9;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase}
.lhead .ar{color:#fff;opacity:.95}
.steps{display:flex;gap:6px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:none}
.steps button{flex:none;padding:8px 13px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:800;font-size:.86rem;color:var(--ink2)}
.steps button.cur{background:var(--c);color:#fff;border-color:var(--c)}
.steps button.dn{border-color:#BDE8D0;color:var(--ok)}
.panel{margin-top:8px}
.instr{display:flex;gap:12px;align-items:flex-start;background:var(--cl);border-radius:16px;padding:13px 16px;margin-bottom:16px}
.instr>div{flex:1;min-width:0}
.instr .n{width:34px;height:34px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.instr b{font-size:1.05rem}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:22px}

/* vocab */
.vcard{background:#fff;border-radius:18px;box-shadow:var(--sh2);border:2px solid var(--line);padding:16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.vcard:hover{border-color:var(--c)}
.vcard .em{font-size:2.6rem;line-height:1.1;min-height:48px}
.vcard .w{font-family:var(--fh);font-weight:800;font-size:1.35rem}
.vcard .ex{font-size:.9rem;color:var(--ink2)}
.vcard.playing{border-color:var(--sun);box-shadow:0 0 0 4px rgba(255,194,51,.35)}

/* player */
.player{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px}
.bigplay{width:96px;height:96px;border-radius:50%;background:var(--c);color:#fff;font-size:2.3rem;display:grid;place-items:center;box-shadow:0 6px 0 var(--cd)}
.bigplay:active{transform:translateY(3px);box-shadow:0 3px 0 var(--cd)}
.wave{display:flex;gap:4px;align-items:center;height:36px}
.wave i{width:6px;border-radius:4px;background:var(--cl);height:10px;transition:height .2s}
.player.on .wave i{background:var(--c);animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}.wave i:nth-child(6){animation-delay:.5s}.wave i:nth-child(7){animation-delay:.6s}
@keyframes wv{0%,100%{height:8px}50%{height:34px}}
.prog{width:100%;max-width:520px;height:10px;border-radius:99px;background:var(--cl);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--c);transition:width .3s}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{padding:7px 12px;font-weight:800;font-size:.86rem;background:#fff}
.seg button.on{background:var(--c);color:#fff}
.plays{font-weight:800;color:var(--muted);font-size:.9rem}

/* tasks */
.task{background:#fff;border-radius:18px;border:2px solid var(--line);padding:16px 18px;margin-bottom:12px}
.task .q{font-weight:800;font-size:1.06rem;margin-bottom:10px}
.task .q .num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--cl);color:var(--cd);margin-right:8px;font-size:.9rem}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:10px 14px;border-radius:13px;border:2px solid var(--line);background:#fff;font-weight:400;text-align:left;display:flex;gap:8px;align-items:baseline}
.opt .l{font-weight:800;color:var(--c)}
.opt:hover{border-color:var(--c)}
.opt.sel{border-color:var(--c);background:var(--cl)}
.opt.right{border-color:var(--ok);background:var(--ok-l)}
.opt.wrong{border-color:var(--bad);background:var(--bad-l)}
.task.ok{border-color:#BDE8D0}.task.no{border-color:#F5C2C3}
.fb{margin-top:8px;font-weight:800;font-size:.92rem}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.gapin{width:150px;display:inline-block;margin:0 4px}
.ochips{display:flex;flex-direction:column;gap:8px}
.ochip{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:13px;border:2px dashed var(--line);background:#fff;text-align:left}
.ochip .o{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;flex:none;color:#fff}
.ochip.picked{border-style:solid;border-color:var(--c)}
.ochip.picked .o{background:var(--c);border-color:var(--c)}
.scorebox{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;border-radius:18px;box-shadow:var(--sh);padding:16px 20px;margin:14px 0}
.scorebox .big{font-family:var(--fh);font-size:2.4rem;font-weight:800;color:var(--c)}

/* transcript */
.tline{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:14px;cursor:pointer;border:2px solid transparent;width:100%;text-align:left}
.tline:hover{background:var(--cl)}
.tline.playing{background:#FFF7DD;border-color:var(--sun)}
.tline.me{background:#FFF0EC;border-color:var(--coral)}
.tline.playing,.tline.me.playing{background:#FFF7DD;border-color:var(--sun);box-shadow:0 0 0 4px rgba(255,194,51,.35)}
#rmsg:not(:empty){position:sticky;bottom:12px;background:#fff;border:3px solid var(--coral);border-radius:16px;padding:12px 16px;box-shadow:var(--sh);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;color:var(--ink)}
.vgrid{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;font-size:.95rem}
.tline .who{font-weight:800;font-size:.85rem}
.tline .say{font-size:1.04rem}
.hidden-line{filter:blur(6px);user-select:none}

/* recorder */
.rec{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border-radius:16px;background:var(--bg);border:2px solid var(--line)}
.rec .dot{width:12px;height:12px;border-radius:50%;background:var(--bad);display:none}
.rec.live .dot{display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.rec .note{font-size:.82rem;color:var(--muted);flex-basis:100%}
.wc{flex-basis:100%;font-size:.95rem}
.wc .hit{background:var(--ok-l);color:#11724a;border-radius:6px;padding:0 4px;font-weight:800}
.wc .miss{background:var(--bad-l);color:#B4262B;border-radius:6px;padding:0 4px}

/* chunks */
.chunk{display:flex;gap:12px;align-items:center;padding:13px 15px;border-radius:15px;background:#fff;border:2px solid var(--line);text-align:left;width:100%}
.chunk.playing{border-color:var(--sun);background:#FFF9E6}
.chunk .pl{width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.chunk b{font-size:1.05rem}

/* sound check */
.pairrow{display:flex;gap:8px;flex-wrap:wrap}
.bigchoice{flex:1;min-width:140px;padding:18px;border-radius:18px;border:3px solid var(--line);background:#fff;font-family:var(--fh);font-weight:800;font-size:1.4rem}
.bigchoice:hover{border-color:var(--c)}
.bigchoice.right{border-color:var(--ok);background:var(--ok-l)}
.bigchoice.wrong{border-color:var(--bad);background:var(--bad-l)}
.round{font-weight:800;color:var(--muted)}
.meter{display:flex;gap:4px;flex-wrap:wrap}
.meter i{width:14px;height:14px;border-radius:4px;background:var(--line)}
.meter i.ok{background:var(--ok)}.meter i.no{background:var(--bad)}

/* games */
.gtile{border-radius:20px;padding:18px;background:#fff;box-shadow:var(--sh);border:2px solid transparent;text-align:left;display:flex;flex-direction:column;gap:6px}
.gtile:hover{border-color:var(--c)}
.gtile .em{font-size:2.4rem}
.hud{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-weight:800}
.hud span{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px}
.pick4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.pick4 button{padding:16px 10px;border-radius:18px;border:3px solid var(--line);background:#fff;font-weight:800;font-size:1.05rem;display:flex;flex-direction:column;align-items:center;gap:4px}
.pick4 button .em{font-size:2.2rem}
.pick4 button.right{border-color:var(--ok);background:var(--ok-l)}
.pick4 button.wrong{border-color:var(--bad);background:var(--bad-l)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
.confetti i.c{width:11px;height:11px;border-radius:50%}.confetti i.s{width:6px;height:18px;border-radius:2px}
.confetti i.d{animation-name:fall2;animation-duration:2.4s;animation-timing-function:cubic-bezier(.25,.6,.5,1)}
@keyframes fall2{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),108vh) rotate(var(--rot));opacity:.85}}
.celebrate{position:fixed;inset:0;display:grid;place-items:center;z-index:60;pointer-events:none}
.cbadge{background:#fff;border-radius:28px;padding:20px 34px 18px;text-align:center;border:4px solid #FFC233;box-shadow:0 22px 60px rgba(20,30,60,.32);display:flex;flex-direction:column;align-items:center;gap:2px;max-width:86vw;animation:cpop .55s cubic-bezier(.2,1.6,.4,1) both}
.cbadge .cstar{font-size:3.6rem;line-height:1.1;animation:cwob .9s ease-in-out .35s 2}
.cbadge b{font:800 1.8rem/1.2 var(--fh);color:#1D2433}.cbadge .ar{font-size:1.15rem;color:#56607A}
.cbadge .cst{color:#FFB400;font-size:1.5rem;letter-spacing:4px}
.celebrate.out .cbadge{animation:cout .45s ease-in forwards}
@keyframes cpop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes cout{to{transform:scale(.7) translateY(-40px);opacity:0}}
@keyframes cwob{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) scale(1.15)}75%{transform:rotate(14deg) scale(1.15)}}
@keyframes rbump{40%{transform:scale(1.07)}}
@keyframes rshake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pick4 button.right,.bigchoice.right,.opt.right.just{animation:rbump .35s ease-out}
.pick4 button.wrong,.bigchoice.wrong{animation:rshake .4s ease-in-out}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.cbadge,.cbadge .cstar,.pick4 button,.bigchoice{animation:none!important}}

/* teacher card */
.tcard{background:#FFF8EC;border:2px solid #FFD98A;border-radius:18px;padding:14px 16px;margin:12px 0}
.tcard h4{font-size:1.05rem;margin-bottom:4px}
.kag{background:#fff;border-radius:16px;border:2px solid var(--line);padding:14px 16px}
.kag ol{margin:6px 0 0 18px;padding:0}
.kag li{margin:2px 0}

/* certificate */
.cert{background:#fff;border-radius:22px;padding:34px;text-align:center;border:10px solid var(--cl);outline:3px solid var(--c);outline-offset:-22px;max-width:760px;margin:20px auto}
.cert h1{font-size:2.4rem;color:var(--cd)}
.cert .nm{font-family:var(--fh);font-size:2.2rem;font-weight:800;margin:12px 0;color:var(--coral)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,25,40,.45);display:grid;place-items:center;z-index:60;padding:18px}
.modal .card{max-width:460px;width:100%}

.foot{text-align:center;color:var(--muted);font-size:.82rem;margin-top:40px}
.selfrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.faces button{font-size:1.6rem;padding:2px 6px;border-radius:10px;opacity:.45}
.faces button.on{opacity:1;background:var(--cl)}
.ktext{font-family:var(--fh);font-size:1.75rem;font-weight:700;line-height:1.75;margin:.6rem 0}
.ktext.sm{font-size:1.12rem;font-weight:600;margin:0}
.kw{border-radius:7px;padding:0 3px;cursor:pointer;transition:background .08s,color .08s}
.kw:hover{background:var(--cl)}.kw.on{background:var(--sun);color:#1D2433}.kw.past{color:var(--cd)}
.ktext.blind .kw{filter:blur(8px)}
.choral .ktext{font-size:2.8rem}.choral .ktext.sm{font-size:1.6rem}
.hints{display:flex;flex-wrap:wrap;gap:8px}
.hint{background:#F1ECFF;border-radius:12px;padding:6px 10px;font-size:.88rem;font-weight:700;color:#4630A8}
.shmsg{min-height:1.6em;font-weight:800;text-align:center;font-size:1.1rem;margin:.5rem 0 0}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:18px 0 6px}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:800;font-size:.85rem}
.dot.pr{background:var(--cl);border-color:var(--c)}.dot.ms{background:var(--sun);border-color:#E0A800}

/* ---------- Recorder ---------- */
const SRec = (PLAT === 'electron' || PLAT === 'android') ? null : (window.SpeechRecognition || window.webkitSpeechRecognition);
const canMic = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
const Active = { rec: null };
function stopAllRec() { if (Active.rec) { try { Active.rec.kill(); } catch (e) {} Active.rec = null; } }

function mountRecorder(box, o) {
  // o: { model: clip|null, target: text|null, label }
  let mr = null, stream = null, chunks = [], url = null, live = false;
  box.classList.add('rec');
  box.innerHTML = `<span class="dot"></span>
    <button class="btn sm" data-r="rec">🎙️ ${esc(o.label || 'Record')}</button>
    <button class="btn sm sec" data-r="mine" disabled>▶ My voice</button>
    ${o.model ? '<button class="btn sm sec" data-r="model">🔊 Model</button>' : ''}
    ${(o.target && SRec) ? '<button class="btn sm sec" data-r="wc">🎯 Word check (online)</button>' : ''}
    <label class="btn sm sec" data-r="file" style="display:none">📁 Use my device recorder<input type="file" accept="audio/*" capture style="display:none"></label>
    <div class="note"></div><div class="wc"></div>`;
  const B = k => box.querySelector(`[data-r="${k}"]`), note = box.querySelector('.note'), wc = box.querySelector('.wc');
  const fallback = msg => {
    B('rec').style.display = 'none'; B('file').style.display = 'inline-flex';
    note.textContent = msg || 'Live recording is not available here. Record with your device, or say it aloud and compare with the model.';
  };
  if (!canMic) fallback();
  const self = {
    kill() { try { if (mr && mr.state !== 'inactive') mr.stop(); } catch (e) {} try { stream && stream.getTracks().forEach(t => t.stop()); } catch (e) {} live = false; box.classList.remove('live'); }
  };
  B('rec').onclick = async () => {
    if (live) { mr.stop(); return; }
    AU.stop(); stopAllRec();

      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = () => {
        const b = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
        if (url) URL.revokeObjectURL(url); url = URL.createObjectURL(b);
        try { stream.getTracks().forEach(t => t.stop()); } catch (e) {}
        live = false; box.classList.remove('live'); B('rec').innerHTML = '🎙️ Record again'; B('mine').disabled = false;
        note.textContent = 'Listen to your voice, then the model. What sounds different?';
        o.onDone && o.onDone();

      mr.start(); live = true; Active.rec = self; box.classList.add('live'); B('rec').innerHTML = '⏹ Stop'; note.textContent = 'Recording… speak now.';
    } catch (e) { fallback('Microphone permission was not given. You can use your device recorder instead, or say it aloud.'); }
  };
  const fi = box.querySelector('input[type=file]');
  fi.onchange = () => { const f = fi.files && fi.files[0]; if (!f) return; if (url) URL.revokeObjectURL(url); url = URL.createObjectURL(f); B('mine').disabled = false; note.textContent = 'Recording loaded. Listen and compare.'; o.onDone && o.onDone(); };
  B('mine').onclick = () => { if (!url) return; AU.stop(); AU.el.src = url; AU.el.playbackRate = 1; AU.el.play().catch(() => {}); };
  if (o.model) B('model').onclick = () => AU.one(o.model);

    AU.stop();

      const r = new SRec(); r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 3;
      wc.innerHTML = '<span class="muted">Listening… say the sentence.</span>';
      r.onresult = e => {
        const heard = new Set(); for (const a of e.results[0]) normWords(a.transcript).forEach(w => heard.add(w));
        const tw = normWords(o.target); let hit = 0;
        wc.innerHTML = '<b>Word check:</b> ' + tw.map(w => { const h = heard.has(w); if (h) hit++; return `<span class="${h ? 'hit' : 'miss'}">${esc(w)}</span>`; }).join(' ') +
          ` <span class="muted">(${hit}/${tw.length} words recognised — this checks words only, not pronunciation)</span>`;
      };
      r.onerror = ev => { wc.innerHTML = `<span class="muted">Word check is not available now (${esc(ev.error)}). It needs Chrome and an internet connection.</span>`; };
      r.start();

  };

}
const findLesson = () => { const u = U(S.g, S.u); return [...u.listen, ...u.speak].find(x => x.id === S.id); };

  if (S.step === 4) {
    if (!S.checked && !S.everChecked) {
      P.innerHTML = instr(5, 'script') + `<div class="card" style="text-align:center"><h3>🔒 Finish the tasks first</h3><p>Answer the questions and press <b>Check</b> to open the script.</p><button class="btn band" id="toT">Go to Tasks</button></div>`;
      $('#toT', P).onclick = () => { S.step = 3; render(); };
    } else {
      P.innerHTML = instr(5, 'script') + `<div class="ctrls" style="justify-content:flex-start;margin-bottom:10px"><button class="btn sm band" id="playAll">▶ Play with script</button><button class="btn sm sec" id="stopS">⏹ Stop</button><button class="btn sm" id="toSh">🎙️ Shadow this script</button></div>
        <div class="card" style="padding:10px">${lines.map((l, i) => `<button class="tline" data-l="${i}">${avatar(l.sp, l.name)}<span><span class="who" style="color:${SPC[l.sp]}">${esc(l.name)}</span><br><span class="say">${esc(l.text)}</span></span></button>`).join('')}</div>`;
      const nodes = $$('[data-l]', P);
      nodes.forEach(n => n.onclick = () => AU.one(clipOf(lines[+n.dataset.l]), 1, n));
      $('#playAll', P).onclick = () => AU.list(lines.map(clipOf), { onLine: i => { nodes.forEach(x => x.classList.remove('playing')); if (i >= 0) { nodes[i].classList.add('playing'); nodes[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } } });
      $('#stopS', P).onclick = () => AU.stop();
      $('#toSh', P).onclick = () => go('shadow', { g: S.g, u: S.u, src: 'l' + L.n });
    }
  }
  if (S.step === 5) {
    P.innerHTML = instr(6, 'speak') + `<div class="card"><h3 style="font-size:1.3rem">🗣️ ${esc(L.speak.prompt)}</h3>${L.speak.frame ? `<p style="font-size:1.1rem;background:var(--cl);border-radius:12px;padding:10px 14px">${esc(L.speak.frame)}</p>` : ''}<div id="rb" style="margin-top:10px"></div></div>
      ${S.best != null || Store.get(L.id) ? `<div class="scorebox">${starHTML(starsFor(S.best != null ? S.best : (Store.get(L.id) || {}).best || 0))}<span>Press <b>Finish ✓</b> to save this lesson.</span></div>` : ''}`;
    mountRecorder($('#rb', P), { label: 'Record my answer' });
  }
};

function renderTasks(P, L) {
  const tasks = L.tasks;
  let n = 0;
  const html = tasks.map((t, i) => {
    n++;
    const a = S.ans[i], res = S.res && S.res[i];
    const cls = S.checked ? (res ? 'ok' : 'no') : '';
    let body = '';
    if (t.type === 'mcq') {
      body = `<div class="q"><span class="num">${n}</span>${esc(t.q)}</div><div class="opts">${t.opts.map((o, j) => {
        let c = a === j ? 'sel' : ''; if (S.checked) { if (j === t.ans) c = 'right'; else if (a === j) c = 'wrong'; }
        return `<button class="opt ${c}" data-t="${i}" data-o="${j}" ${S.checked ? 'disabled' : ''}><span class="l">${LET[j]})</span><span>${esc(o)}</span></button>`; }).join('')}</div>`;
    } else if (t.type === 'tf') {
      body = `<div class="q"><span class="num">${n}</span>${esc(t.s)}</div><div class="opts">${[true, false].map(v => {
        let c = a === v ? 'sel' : ''; if (S.checked) { if (v === t.ans) c = 'right'; else if (a === v) c = 'wrong'; }
        return `<button class="opt ${c}" data-t="${i}" data-o="${v ? 'T' : 'F'}" ${S.checked ? 'disabled' : ''}><b>${v ? 'True' : 'False'}</b> <span class="ar">${v ? 'صح' : 'خطأ'}</span></button>`; }).join('')}</div>`;
    } else if (t.type === 'order') {
      if (!S.ord[i]) S.ord[i] = { show: shuffle(t.items.map((_, k) => k)), pick: [] };
      const O = S.ord[i];
      body = `<div class="q"><span class="num">${n}</span>Put these in the order you hear them.</div><div class="ochips">${O.show.map(k => { const pos = O.pick.indexOf(k);
        return `<button class="ochip ${pos >= 0 ? 'picked' : ''}" data-t="${i}" data-k="${k}" ${S.checked ? 'disabled' : ''}><span class="o">${pos >= 0 ? pos + 1 : ''}</span>${esc(t.items[k])}</button>`; }).join('')}</div>
        ${S.checked ? '' : `<button class="btn sm sec" data-reset="${i}" style="margin-top:8px">↺ Reset order</button>`}
        ${S.checked && !res ? `<div class="fb no">Correct order: ${t.items.map((x, k) => (k + 1) + '. ' + esc(x)).join(' → ')}</div>` : ''}`;
    } else if (t.type === 'gap') {
      const [pre, post] = t.s.split('___');
      body = `<div class="q"><span class="num">${n}</span>${esc(pre)}<input type="text" class="gapin" data-gap="${i}" value="${esc(a || '')}" ${S.checked ? 'disabled' : ''} aria-label="answer" autocomplete="off" autocapitalize="off" spellcheck="false">${esc(post || '')}</div>
        ${S.checked && !res ? `<div class="fb no">Answer: ${esc(t.ans[0])}</div>` : ''}`;
    }
    const fb = S.checked ? `<div class="fb ${res ? 'ok' : 'no'}">${res ? '✓ Correct!' : (t.type === 'mcq' || t.type === 'tf' ? '✗ Not quite — the correct answer is shown in green.' : '✗ Not quite.')}</div>` : '';
    return `<div class="task ${cls}">${body}${(t.type === 'mcq' || t.type === 'tf') ? fb : (S.checked && res ? fb : '')}</div>`;
  }).join('');
  const groups = [...new Set(tasks.map(t => t.type))].map(k => `<b>${esc(T[k][0])}</b> <span class="ar">${esc(T[k][1])}</span>`).join('<br>');
  const sc = S.res ? S.res.filter(Boolean).length : 0;
  P.innerHTML = instr(4, 'tasks', `<div style="font-size:.9rem;margin-top:4px">${groups}</div>`) +
    `<div class="ctrls" style="justify-content:flex-start;margin-bottom:10px"><button class="btn sm sec" id="replay">🔊 Play the recording again</button><button class="btn sm sec" id="stopT">⏹</button></div>` + html +
    (S.checked ? `<div class="scorebox"><span class="big">${sc}/${tasks.length}</span>${starHTML(starsFor(sc / tasks.length))}<span style="flex:1">${sc === tasks.length ? 'Excellent! Perfect score! 🎉' : sc / tasks.length >= .7 ? 'Great listening! Check the script to see what you missed.' : 'Good try! Listen again and try the wrong ones.'}</span>${sc < tasks.length ? '<button class="btn sec" id="retry">↺ Try wrong ones again</button>' : ''}<button class="btn band" id="toScript">Read the script →</button></div>`
      : `<div class="navrow" style="justify-content:flex-end"><button class="btn ok" id="checkB">✓ Check my answers</button></div>`);
  $('#replay', P).onclick = () => AU.list(L.script.map(clipOf), { gap: 700 });
  $('#stopT', P).onclick = () => AU.stop();
  $$('.opt[data-t]', P).forEach(b => b.onclick = () => { const i = +b.dataset.t, t = tasks[i]; S.ans[i] = t.type === 'tf' ? b.dataset.o === 'T' : +b.dataset.o; renderTasks(P, L); });
  $$('.ochip', P).forEach(b => b.onclick = () => { const i = +b.dataset.t, k = +b.dataset.k, O = S.ord[i]; const p = O.pick.indexOf(k); if (p >= 0) O.pick.splice(p, 1); else O.pick.push(k); renderTasks(P, L); });
  $$('[data-reset]', P).forEach(b => b.onclick = () => { S.ord[+b.dataset.reset].pick = []; renderTasks(P, L); });
  $$('[data-gap]', P).forEach(inp => inp.oninput = () => { S.ans[+inp.dataset.gap] = inp.value; });
  const ck = $('#checkB', P);
  if (ck) ck.onclick = () => {
    const missing = tasks.findIndex((t, i) => t.type === 'order' ? S.ord[i].pick.length < t.items.length : (S.ans[i] == null || S.ans[i] === ''));
    if (missing >= 0 && !S.warned) { S.warned = true; ck.textContent = 'Some answers are empty — press again to check'; return; }
    S.res = tasks.map((t, i) => {
      if (t.type === 'mcq') return S.ans[i] === t.ans;
      if (t.type === 'tf') return S.ans[i] === t.ans;
      if (t.type === 'order') return S.ord[i].pick.join(',') === t.items.map((_, k) => k).join(',');
      if (t.type === 'gap') { const v = normWords(S.ans[i] || '').join(' '); return t.ans.some(x => normWords(x).join(' ') === v); }
      return false;
    });
    S.checked = true; S.everChecked = true; S.warned = false;
    const r = S.res.filter(Boolean).length / tasks.length; S.best = Math.max(S.best || 0, r);
    Store.rec(L.id, { stars: starsFor(S.best), best: S.best });
    RX.done(r, .9, .7, r === 1 ? ['Perfect score!', 'علامة كاملة!'] : null);
    renderTasks(P, L); P.scrollIntoView({ block: 'start' });
  };
  const rt = $('#retry', P);
  if (rt) rt.onclick = () => { tasks.forEach((t, i) => { if (!S.res[i]) { if (t.type === 'order') S.ord[i].pick = []; else delete S.ans[i]; } }); S.checked = false; renderTasks(P, L); };
  const ts = $('#toScript', P); if (ts) ts.onclick = () => { S.step = 4; render(); window.scrollTo({ top: 0 }); };
}

/* ---------- Speaking lesson ---------- */
VIEWS.speak = m => {
  const L = findLesson(); const steps = ['Listen', 'Useful language', 'Sound Check', 'Shadowing', 'Role-play', 'Your turn'];
  const P = lessonShell(m, L, steps, 'Speaking ' + L.n);
  const lines = L.model;
  $('#nextB', m).onclick = () => {
    if (S.step < steps.length - 1) { S.step++; AU.stop(); stopAllRec(); render(); window.scrollTo({ top: 0 }); }
    else { const prev = Store.get(L.id) || {}; const r = Math.max(S.sbest || 0, prev.best || 0); Store.rec(L.id, { done: true, stars: Math.max(starsFor(r), S.roleDone ? 1 : 0), best: r }); celebrate(['Lesson complete!', 'أنهيت الدرس!'], Math.max(starsFor(r), S.roleDone ? 1 : 0)); go('unit', { g: S.g, u: S.u }); }
  };
  if (S.step === 0) {

      <div class="card" style="padding:10px">${lines.map((l, i) => `<button class="tline" data-l="${i}">${avatar(l.sp, l.name)}<span><span class="who" style="color:${SPC[l.sp]}">${esc(l.name)}</span><br><span class="say">${esc(l.text)}</span></span></button>`).join('')}</div>`;
    let rate = 1; $$('#spd button', P).forEach(b => b.onclick = () => { rate = +b.dataset.r; $$('#spd button', P).forEach(x => x.classList.toggle('on', x === b)); });
    const nodes = $$('[data-l]', P);
    nodes.forEach(n => n.onclick = () => AU.one(clipOf(lines[+n.dataset.l]), rate, n));
    $('#pA', P).onclick = () => AU.list(lines.map(clipOf), { rate, onLine: i => { nodes.forEach(x => x.classList.remove('playing')); if (i >= 0) nodes[i].classList.add('playing'); } });
    $('#sA', P).onclick = () => AU.stop();
  }
  if (S.step === 1) {
    P.innerHTML = instr(2, 'chunks') + `<div class="lesson-list">${L.chunks.map((c, i) => `<button class="chunk" data-c="${i}"><span class="pl">▶</span><span style="flex:1"><b>${esc(c.en)}</b>${c.ar ? `<span class="ar ar-block">${esc(c.ar)}</span>` : ''}</span></button>`).join('')}</div>
      <div class="ctrls" style="margin-top:14px"><button class="btn band" id="rep">🔁 Listen and repeat (pauses for you)</button><button class="btn sec" id="sC">⏹</button></div>`;
    const nodes = $$('[data-c]', P);
    nodes.forEach(n => n.onclick = () => AU.one(clipOf(L.chunks[+n.dataset.c]), 1, n));
    $('#rep', P).onclick = () => { const items = []; L.chunks.forEach(c => { items.push(clipOf(c)); items.push({ wait: () => sleep(Math.max(1800, c.en.split(' ').length * 550)) }); });
      AU.list(items, { gap: 250, onLine: i => { nodes.forEach(x => x.classList.remove('playing')); if (i >= 0) nodes[Math.floor(i / 2)].classList.add('playing'); } }); };
    $('#sC', P).onclick = () => AU.stop();
  }
  if (S.step === 2) renderSound(P, L);
  if (S.step === 3) {
    S.sh = S.sh || 0; const i = S.sh, l = lines[i];
    P.innerHTML = instr(4, 'shadow') + `<div class="card" style="text-align:center"><div class="round">Line ${i + 1} of ${lines.length}</div>
      <div style="display:flex;justify-content:center;align-items:center;gap:12px;margin:12px 0">${avatar(l.sp, l.name)}<b style="color:${SPC[l.sp]}">${esc(l.name)}</b></div>
      <p style="font-family:var(--fh);font-size:1.6rem;font-weight:700;margin:.2rem 0 1rem">${esc(l.text)}</p>
      <div class="ctrls"><button class="btn band" id="hear">🔊 Listen</button><span class="seg" id="spd"><button data-r="0.75">🐢 Slow</button><button data-r="1" class="on">Normal</button></span></div>
      <div id="rb" style="margin:14px auto 0;max-width:640px;justify-content:center"></div>
      <div class="navrow"><button class="btn sm sec" id="shP" ${i === 0 ? 'disabled' : ''}>← Previous line</button><button class="btn sm band" id="shN" ${i === lines.length - 1 ? 'disabled' : ''}>Next line →</button></div></div>
      <p class="muted" style="text-align:center">Tip: say it at the <b>same time</b> as the speaker for real shadowing. Copy the rhythm and the music of the sentence.</p>
      <div class="ctrls"><button class="btn" id="toSh">🎙️ Open the Shadowing Studio (5 steps, timing feedback)</button></div>`;

    $('#hear', P).onclick = () => AU.one(clipOf(l), rate);
    mountRecorder($('#rb', P), { model: clipOf(l), target: l.text, label: 'Record' });
    $('#shP', P).onclick = () => { S.sh--; render(); };
    $('#shN', P).onclick = () => { S.sh++; render(); };

      <p class="muted" style="font-size:.85rem;margin:.6rem 0 0">😟 Not yet · 🙂 With help · 🤩 Yes, I can!</p></div>`;
    mountRecorder($('#rb', P), { label: 'Record my answer' });
    $$('[data-sc]', P).forEach(b => b.onclick = () => { S.self[+b.dataset.sc] = +b.dataset.v; $$(`[data-sc="${b.dataset.sc}"]`, P).forEach(x => x.classList.toggle('on', x === b)); });
  }
};

function renderSound(P, L) {
  const s = L.sound; S.sq = S.sq || null;
  const playQ = () => { const Q = S.sq; if (!Q) return; const it = Q.q[Q.k]; if (!it) return; if (s.type === 'pairs') AU.one({ src: s.audio[it.i][it.side], text: s.pairs[it.i][it.side] }); else AU.one(clipOf(s.items[it.i])); };
  const intro = `<div class="card"><h3 style="font-size:1.3rem">🔉 ${esc(s.title)}</h3><p style="margin:.4rem 0">${esc(s.en)}</p><p class="ar">${esc(s.ar)}</p></div>`;
  if (!S.sq) {
    let ex = '';
    if (s.type === 'pairs') ex = `<div class="card" style="margin-top:14px"><b>Listen to each pair first:</b><div class="grid g3" style="margin-top:10px">${s.pairs.map((p, i) => `<div class="pairrow"><button class="btn sm sec" data-pa="${i}" data-side="0">🔊 ${esc(p[0])}</button><button class="btn sm sec" data-pa="${i}" data-side="1">🔊 ${esc(p[1])}</button></div>`).join('')}</div></div>`;
    else ex = `<div class="card" style="margin-top:14px"><b>The groups:</b><div class="pairrow" style="margin-top:8px">${s.cats.map(c => `<span class="chip">${esc(c.label)}</span>`).join('')}</div><p class="muted" style="margin:.6rem 0 0">You will hear ${s.items.length} words or sentences. Choose the right group for each one.</p></div>`;
    const prev = Store.get(L.id) || {};
    P.innerHTML = instr(3, 'sound') + intro + ex + `<div class="ctrls" style="margin-top:16px"><button class="btn band" id="startQ">▶ Start Sound Check</button></div>${prev.best ? `<p class="muted" style="text-align:center">Best score: ${Math.round(prev.best * 100)}%</p>` : ''}`;
    $$('[data-pa]', P).forEach(b => b.onclick = () => AU.one({ src: s.audio[+b.dataset.pa][+b.dataset.side], text: s.pairs[+b.dataset.pa][+b.dataset.side] }, 1, b));
    $('#startQ', P).onclick = () => {
      let q;
      if (s.type === 'pairs') { q = []; for (let r = 0; r < 10; r++) { const i = r % s.pairs.length; q.push({ i, side: Math.random() < .5 ? 0 : 1 }); } q = shuffle(q); }
      else q = shuffle(s.items.map((it, i) => ({ i })));
      S.sq = { q, k: 0, res: [], answered: false }; renderSound(P, L); playQ();
    };
    return;
  }
  const Q = S.sq;
  if (Q.k >= Q.q.length) {
    const r = Q.res.filter(Boolean).length / Q.q.length; S.sbest = Math.max(S.sbest || 0, r); Store.rec(L.id, { stars: starsFor(r), best: r }); if (!Q.cel) { Q.cel = true; RX.done(r, .9, .7, r >= .9 ? ['Super ears!', 'أذنان رائعتان!'] : null); }
    P.innerHTML = instr(3, 'sound') + `<div class="scorebox"><span class="big">${Q.res.filter(Boolean).length}/${Q.q.length}</span>${starHTML(starsFor(r))}<span style="flex:1">${r >= .9 ? 'Super ears! 👂✨' : r >= .7 ? 'Great job! Keep practising.' : 'These sounds are tricky. Listen to the pairs again and try once more.'}</span><button class="btn sec" id="againQ">↺ Try again</button></div>`;
    $('#againQ', P).onclick = () => { S.sq = null; renderSound(P, L); };
    return;
  }
  const it = Q.q[Q.k];
  const choices = s.type === 'pairs' ? s.pairs[it.i].map((w, j) => ({ label: w, ok: j === it.side })) : s.cats.map(c => ({ label: c.label, ok: c.key === s.items[it.i].key }));
  P.innerHTML = instr(3, 'sound') + `<div class="card" style="text-align:center"><div class="round">Question ${Q.k + 1} of ${Q.q.length}</div>
    <div class="meter" style="justify-content:center;margin:8px 0">${Q.q.map((_, j) => `<i class="${j < Q.res.length ? (Q.res[j] ? 'ok' : 'no') : ''}"></i>`).join('')}</div>
    <button class="bigplay" id="pq" style="margin:10px auto" aria-label="Play again">🔊</button>
    <p style="font-weight:800">${s.type === 'pairs' ? 'Which one do you hear?' : 'Which group is it?'}</p>
    <div class="pairrow">${choices.map((c, j) => `<button class="bigchoice" data-ch="${j}">${esc(c.label)}</button>`).join('')}</div>
    <p id="qfb" style="min-height:1.6em;font-weight:800"></p>
    ${Q.answered ? '' : ''}</div>`;
  $('#pq', P).onclick = playQ;
  $$('[data-ch]', P).forEach(b => b.onclick = async () => {
    if (Q.answered) return; Q.answered = true; const c = choices[+b.dataset.ch];
    b.classList.add(c.ok ? 'right' : 'wrong'); if (!c.ok) $$('[data-ch]', P)[choices.findIndex(x => x.ok)].classList.add('right');
    $('#qfb', P).innerHTML = c.ok ? '<span style="color:var(--ok)">✓ Correct!</span>' : `<span style="color:var(--bad)">✗ It was “${esc(choices.find(x => x.ok).label)}”.</span>` + (s.type === 'sort' ? ` <span class="muted">(${esc(s.items[it.i].text)})</span>` : '');
    Q.res.push(c.ok);
    await Promise.all([sleep(c.ok ? 900 : 1900), RX.answer(c.ok)]);
    if (S.sq !== Q) return; Q.k++; Q.answered = false; renderSound(P, L); if (Q.k < Q.q.length) playQ();
  });
}

function renderRole(P, L) {
  const lines = L.model, roles = L.roles;
  const nameOf = sp => (lines.find(l => l.sp === sp) || {}).name || sp;
  S.role = S.role || null; S.showText = S.showText !== false;
  P.innerHTML = instr(5, 'role') + `<div class="card"><b>Choose your part:</b><div class="pairrow" style="margin-top:10px">${roles.map(r => `<button class="bigchoice ${S.role === r ? 'right' : ''}" data-role="${r}"><span style="display:flex;align-items:center;justify-content:center;gap:10px">${avatar(r, nameOf(r))} ${esc(nameOf(r))}</span></button>`).join('')}</div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:700"><input type="checkbox" id="stx" ${S.showText ? 'checked' : ''}> Show my lines (turn off for a challenge!)</label></div>
    <div class="ctrls" style="margin:14px 0"><button class="btn band" id="go" ${S.role ? '' : 'disabled'}>▶ Start role-play</button><button class="btn sec" id="stopR">⏹ Stop</button></div>
    <div class="card" style="padding:10px" id="rl">${lines.map((l, i) => `<div class="tline ${l.sp === S.role ? 'me' : ''}" data-l="${i}">${avatar(l.sp, l.name)}<span style="flex:1"><span class="who" style="color:${SPC[l.sp]}">${esc(l.name)}${l.sp === S.role ? ' — YOU' : ''}</span><br><span class="say ${l.sp === S.role && !S.showText ? 'hidden-line' : ''}">${esc(l.text)}</span></span></div>`).join('')}</div>
    <p class="muted" id="rmsg" style="text-align:center;font-weight:800"></p>`;
  $$('[data-role]', P).forEach(b => b.onclick = () => { S.role = b.dataset.role; renderRole(P, L); });
  $('#stx', P).onchange = e => { S.showText = e.target.checked; renderRole(P, L); };

/* ---------- Games ---------- */
function unitPools(u) {
  const vocab = u.listen.flatMap(l => l.vocab);
  const linesAll = [];
  u.listen.forEach(l => l.script.forEach(x => linesAll.push({ ...x, from: l })));
  u.speak.forEach(s => s.model.forEach(x => linesAll.push({ ...x, from: s })));
  const nSp = les => new Set((les.script || les.model).filter(y => y.sp !== 'NARRATOR').map(y => y.name)).size;
  const who = linesAll.filter(x => x.sp !== 'NARRATOR' && x.text.split(' ').length >= 4 && nSp(x.from) >= 2);
  const dialogs = [...u.speak.map(s => s.model), ...u.listen.map(l => l.script.filter(y => y.sp !== 'NARRATOR'))].filter(d => d.length >= 4 && new Set(d.map(y => y.name)).size >= 2);
  const people = [...new Map(linesAll.filter(x => x.sp !== 'NARRATOR').map(x => [x.name, { name: x.name, sp: x.sp }])).values()];
  const whoOpts = x => shuffle([{ name: x.name, sp: x.sp }, ...pickN(people.filter(p => p.sp !== x.sp && p.name !== x.name), 3)]);
  return { vocab, who, dialogs, whoOpts };
}
VIEWS.game = m => {

    if (S.game === 'who') rounds = pickN(pools.who, 8).map(x => ({ x, opts: pools.whoOpts(x) }));

    S.st = { rounds, k: 0, score: 0, streak: 0, res: [], locked: false };
  }
  const st = S.st;
  const finish = () => {
    const r = st.res.filter(Boolean).length / st.rounds.length; Store.rec(u.id + S.game, { stars: starsFor(r), best: r, done: true }); if (!st.cel) { st.cel = true; RX.done(r, .7, .5, r >= .7 ? [r === 1 ? 'Perfect game!' : 'Great game!', r === 1 ? 'لعبة مثالية!' : 'لعبة رائعة!'] : null); }

  const nextRound = async (ok, after) => { st.res.push(ok); if (ok) { st.streak++; st.score += 10 + Math.min(st.streak - 1, 5) * 2; } else st.streak = 0; const t0 = performance.now(); await RX.answer(ok); if (after && S.st === st) await after(); const left = (ok ? 900 : 2000) - (performance.now() - t0); if (left > 0) await sleep(left); if (S.st !== st) return; st.k++; st.locked = false; VIEWS.game(m); };
  if (S.game === 'catch' || S.game === 'who') {
    const isC = S.game === 'catch';

      <div class="pick4">${R.opts.map((o, j) => isC ? `<button data-o="${j}"><span class="em">${pic(o.emoji)}</span>${esc(o.w)}</button>` : `<button data-o="${j}"><span class="em">${avatar(o.sp, o.name)}</span>${esc(o.name)}</button>`).join('')}</div><p id="fb" style="min-height:1.6em;font-weight:800;text-align:center"></p></div>`;

/* =====================================================================
   v1.4 — ACCOUNTS (kept on this device), SETTINGS and UPDATES
   • Teacher / parent account: username + password. Only a salted
     PBKDF2-SHA256 hash is stored (600,000 rounds), never the password.
     A one-time recovery code resets a forgotten password.
   • Students: name + class + 4-digit PIN (hashed the same way).
   • Wrong tries: after 5, a waiting time that doubles each time.
   • Automatic sign-out after a time without activity.
   • Backups are encrypted with the teacher password (AES-GCM-256).

/* PIN pad: big keys for young children. check(pin) returns {ok} | {bad, left, wait} | {msg}. */
function pinPad(o) {
  return new Promise(done => {
    const m = sheet(`<div class="pinhead">${o.who ? avHTML(o.who) : ''}<div><h3 style="margin:0">${esc(o.title)}</h3>${o.ar ? `<span class="ar">${esc(o.ar)}</span>` : ''}</div></div>
      ${o.sub ? `<p class="muted" style="margin:.4rem 0 0;text-align:center">${o.sub}</p>` : ''}
      <div class="pindots" aria-live="polite">${'<i></i>'.repeat(4)}</div><p class="pinmsg" role="alert"></p>
      <div class="pinpad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button type="button" data-k="${n}">${n}</button>`).join('')}<button type="button" data-k="x" aria-label="Cancel">✕</button><button type="button" data-k="0">0</button><button type="button" data-k="b" aria-label="Delete">⌫</button></div>`, 'pinmodal');
    let pin = '', busy = false, tm = null; const dots = $$('.pindots i', m), msg = $('.pinmsg', m);
    const paint = () => dots.forEach((d, i) => d.classList.toggle('on', i < pin.length));
    const say = (en, ar, bad) => { msg.innerHTML = `${esc(en)}${ar ? ` <span class="ar">${esc(ar)}</span>` : ''}`; msg.classList.toggle('bad', !!bad); };
    const close = v => { clearInterval(tm); document.removeEventListener('keydown', kd, true); m.remove(); done(v); };
    const waitFor = w => { m.classList.add('wait'); const t0 = Date.now(); const tick = () => { const left = w - Math.floor((Date.now() - t0) / 1000); if (left <= 0) { clearInterval(tm); m.classList.remove('wait'); say('Try again now.', 'حاول الآن.'); return; } say(`Too many tries. Wait ${mmss(left)}.`, `محاولات كثيرة. انتظر ${mmss(left)}.`, true); }; tick(); clearInterval(tm); tm = setInterval(tick, 1000); };
    const key = async k => {
      if (busy || m.classList.contains('wait')) { if (k === 'x') close(null); return; }
      if (k === 'x') return close(null);
      if (k === 'b') { pin = pin.slice(0, -1); paint(); return; }
      if (pin.length >= 4) return; pin += k; paint();
      if (pin.length < 4) return;
      busy = true; m.classList.add('busy'); const r = await o.check(pin); busy = false; m.classList.remove('busy');
      if (r && r.ok) return close(r.value != null ? r.value : pin);
      pin = ''; paint(); const box = $('.card', m); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
      if (r && r.wait) waitFor(r.wait);
      else if (r && r.msg) say(r.msg[0], r.msg[1], true);
      else say(r && r.left != null ? `Wrong PIN. ${r.left} ${r.left === 1 ? 'try' : 'tries'} left.` : 'Wrong PIN.', 'رمز خاطئ.', true);
    };
    const kd = e => { if (/^\d$/.test(e.key)) { key(e.key); e.preventDefault(); } else if (e.key === 'Backspace') { key('b'); e.preventDefault(); } else if (e.key === 'Escape') { key('x'); e.preventDefault(); } };
    document.addEventListener('keydown', kd, true);
    $$('[data-k]', m).forEach(b => b.onclick = () => key(b.dataset.k));
    m.dataset.sticky = '1';
    if (o.wait) waitFor(o.wait);
  });
}
// choose a new PIN twice; resolves with the PIN or null
async function newPinFlow(who, title) {
  let first = null;
  const p = await pinPad({ who, title: title || 'Choose your 4-digit PIN', ar: 'اختر رمزًا من 4 أرقام', sub: 'Keep it secret. <span class="ar">احتفظ به سرًّا.</span>', check: async pin => { const r = Auth.pinRule(pin); return r ? { msg: [r === 'four' ? 'Type 4 numbers.' : r === 'same' ? 'Do not use the same number 4 times.' : 'Do not use numbers in a row like 1234.', T_AR[r]] } : { ok: true }; } });
  if (!p) return null; first = p;
  return pinPad({ who, title: 'Type the same PIN again', ar: 'اكتب الرمز نفسه مرة أخرى', check: async pin => pin === first ? { ok: true } : { msg: ['The two PINs are different. Try again.', 'الرمزان مختلفان. حاول مرة أخرى.'] } });
}

/* ---------- Sign in with Google (Gmail or the school's Google e-mail) ----------
   The app has no server. Google's own sign-in button (Google Identity Services) confirms who the user is and
   hands the page a signed ID token; the app reads the name and e-mail from it and opens (or creates) the
   matching account on this device. Only the browser version can use it: Google blocks sign-in inside app web views.
   The teacher pastes the Google "client ID" in Settings. */
const GSI = {
  ICON: '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.6 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.7c-.6 3-2.2 5.5-4.7 7.2l7.6 5.9c4.5-4.1 7-10.2 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C1 16.500 0 20.100 0 24s1 7.500 2.600 10.800l7.900-6.200z"/><path fill="#34A853" d="M24 48c6.300 0 11.700-2.100 15.600-5.700l-7.600-5.900c-2.100 1.400-4.800 2.300-8 2.300-6.300 0-11.600-4.100-13.500-9.900l-7.900 6.200C6.500 42.600 14.600 48 24 48z"/></svg>',
  cfg() { return Object.assign({ cid: '', domains: 'gmail.com' }, Store.data.settings.gsi || {}); },
  put(k, v) { const s = Store.data.settings.gsi = Store.data.settings.gsi || {}; s[k] = v; Store.save(); },
  can() { return PLAT === 'web' && /^https?:$/.test(location.protocol); },
  domains() { return this.cfg().domains.toLowerCase().split(/[\s,;]+/).map(d => d.replace(/^@/, '')).filter(Boolean); },
  load() { return this.lib || (this.lib = new Promise((ok, no) => { if (window.google && google.accounts && google.accounts.id) return ok(); const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = () => ok(); s.onerror = () => { this.lib = null; no(new Error('offline')); }; document.head.appendChild(s); })); },
  parse(jwt) { try { const b = String(jwt).split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b + '==='.slice((b.length + 3) % 4)), c => c.charCodeAt(0)))); } catch (e) { return null; } },
  /* returns [English, Arabic] when the account cannot be used, or null when it is fine */
  check(p) {
    const c = this.cfg(), now = Date.now() / 1000;
    if (!p || !p.email || p.aud !== c.cid || !/^(https:\/\/)?accounts\.google\.com$/.test(p.iss || '') || !(p.exp > now - 60)) return ['Google could not confirm this account. Try again.', 'تعذّر تأكيد الحساب. حاول مرة أخرى.'];
    if (p.email_verified === false) return ['This e-mail address is not verified by Google.', 'هذا البريد غير مؤكَّد لدى Google.'];
    const d = this.domains(), dom = p.email.toLowerCase().split('@')[1];
    if (d.length && !d.includes(dom)) return [`Use a ${d.map(x => '@' + x).join(' or ')} account. (${p.email} is not allowed.)`, 'استخدم حساب Gmail أو بريد المدرسة.'];
    return null;
  },
  /* the token came back from Google: open the matching account, or make it */
  done(resp, m) {
    const p = this.parse(resp && resp.credential), bad = this.check(p), E = m && $('#gE', m);
    if (bad) { if (E) E.innerHTML = `${esc(bad[0])} <span class="ar">${esc(bad[1])}</span>`; return false; }
    const email = p.email.toLowerCase(), P = Store.data.profiles;
    let u = Object.values(P).find(x => (x.email || '').toLowerCase() === email && x.id !== 'teacher' && x.id !== 'guest');
    if (!u) {
      if (!Cfg.sec().selfSignup) { if (E) E.innerHTML = 'This e-mail is not on the class list. Ask your teacher to add you. <span class="ar">اطلب من معلمك إضافتك.</span>'; return false; }
      const id = 'p' + Date.now().toString(36) + [...Sec.rnd(2)].map(x => x.toString(16).padStart(2, '0')).join('');
      u = P[id] = { id, name: String(p.name || email.split('@')[0]).slice(0, 40), cls: '', email, g: true, progress: {}, created: Date.now() };
    }
    u.g = true; Auth.start(u.id, 'student'); if (m) m.remove(); go('home'); return true;
  },
  open(hint) {
    const c = this.cfg();
    if (!c.cid) { const m = sheet(`<h3>${this.ICON.replace('<svg', '<svg style="width:22px;height:22px;vertical-align:-4px"')} Sign in with Google</h3><p>Google sign-in is not switched on yet. The teacher adds the Google sign-in key in <b>⚙️ Settings → Sign in with Google</b>.</p><p class="ar ar-block">لم يُفعَّل الدخول عبر Google بعد. يضيف المعلم مفتاح الدخول من الإعدادات.</p><div class="navrow" style="justify-content:flex-end"><button class="btn" id="gX">OK</button></div>`); $('#gX', m).onclick = () => m.remove(); return; }
    const d = this.domains();
    const m = sheet(`<h3>Sign in with Google <span class="ar">الدخول عبر Google</span></h3>
      <p class="muted" style="margin:.3rem 0 0">Use your ${d.length ? d.map(x => '<b>@' + esc(x) + '</b>').join(' or ') : 'Google'} account.${hint ? ' (' + esc(hint) + ')' : ''} <span class="ar">استخدم حساب Gmail أو بريد المدرسة.</span></p>
      <div class="gbox" id="gBox"><span class="muted">Opening Google…</span></div>
      <p class="pinmsg bad" id="gE" role="alert"></p>
      <p class="secnote">🔒 Google confirms your name and e-mail. Your lessons and progress stay on this device. <span class="ar ar-block">يؤكّد Google اسمك وبريدك فقط، ويبقى تقدّمك على هذا الجهاز.</span></p>
      <div class="navrow" style="justify-content:flex-end"><button class="btn sec" id="gX">Cancel</button></div>`);
    $('#gX', m).onclick = () => m.remove();
    this.load().then(() => {
      if (!document.body.contains(m)) return;
      google.accounts.id.initialize({ client_id: c.cid, callback: r => this.done(r, m), auto_select: false, ux_mode: 'popup', login_hint: hint || undefined });
      const box = $('#gBox', m); box.innerHTML = ''; google.accounts.id.renderButton(box, { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', width: 280 });
    }).catch(() => { const E = $('#gE', m); if (E) { $('#gBox', m).innerHTML = ''; E.innerHTML = 'Google could not be reached. Check the internet and try again. <span class="ar">تعذّر الاتصال بـ Google. تحقّق من الإنترنت.</span>'; } });
  }
};
async function studentSignIn(id) {
  if (id === 'guest') { if (Auth.guestIn()) go('home'); return; }
  const p = Store.data.profiles[id]; if (!p) return;
  if (p.g && GSI.can()) return GSI.open(p.email);
  if (!p.pin) {   // first sign-in after an update, or the teacher reset the PIN
    const pin = await newPinFlow(p, `Hello ${p.name}! Choose your PIN`); if (!pin) return;
    await Auth.setPin(id, pin); Auth.start(id, 'student'); go('home'); return;
  }
  const r = await pinPad({ who: p, title: `Hello ${p.name}!`, ar: 'اكتب رمزك', sub: 'Type your 4-digit PIN.', wait: Auth.locked(id), check: pin => Auth.studentIn(id, pin) });
  if (r) go('home');
}

function changePassFlow() {
  const m = sheet(`<h3>🔐 Change the teacher password <span class="ar">تغيير كلمة المرور</span></h3><form id="cpF" novalidate>
    ${pwField('cpO', 'Current password', 'كلمة المرور الحالية')}${pwField('cpN', 'New password', 'كلمة المرور الجديدة', 'new-password')}${meterHTML('cpM')}${pwField('cpN2', 'Type it again', 'أعد كتابتها', 'new-password')}
    <p class="pinmsg bad" id="cpE" role="alert"></p><div class="navrow"><button type="button" class="btn sec" id="cpX">Cancel</button><button class="btn" type="submit" id="cpB">Save</button></div></form>`);
  bindEyes(m); bindMeter($('#cpN', m), $('#cpM', m)); $('#cpX', m).onclick = () => m.remove();
  $('#cpF', m).onsubmit = async e => {
    e.preventDefault(); const E = $('#cpE', m), n = $('#cpN', m).value;
    const pr = Auth.passRule(n, Auth.A.teacher.user); if (pr) { E.innerHTML = `${esc(pr[0])} <span class="ar">${esc(pr[1])}</span>`; return; }
    if (n !== $('#cpN2', m).value) { E.innerHTML = 'The two new passwords are different.'; return; }
    const B = $('#cpB', m); B.disabled = true; const r = await Auth.verifyTeacher($('#cpO', m).value);
    if (!r.ok) { B.disabled = false; E.innerHTML = r.wait ? `Too many tries. Wait ${mmss(r.wait)}.` : 'The current password is not right.'; return; }
    Auth.A.teacher.pw = await Sec.make(n, ITER.pass); Store.save(); m.remove(); Upd.toast('✅ The new password is saved. <span class="ar">حُفظت كلمة المرور الجديدة.</span>');
  };
}

/* ---------- Backups: encrypted with the teacher password ---------- */
function bkData() { const d = JSON.parse(JSON.stringify(Store.data)); if (d.auth) { d.auth.session = null; d.auth.fails = {}; } return d; }
async function backupFlow(msgEl) {
  const pw = await confirmTeacher('💾 Back up all students', 'The backup is locked with the teacher password. You need this password to restore it.', 'تُقفل النسخة الاحتياطية بكلمة مرور المعلم، وتحتاجها لاستعادتها.'); if (!pw) return;
  const say = t => { if (msgEl) msgEl.textContent = t; };
  let body;
  if (Sec.subtle()) body = { app: 'listen-up-speak-out', backup: 2, saved: new Date().toISOString(), version: APP_VER, enc: await Sec.seal(JSON.stringify(bkData()), pw) };
  else { body = { app: 'listen-up-speak-out', backup: 1, saved: new Date().toISOString(), data: bkData() }; say('This browser cannot encrypt files, so the backup is not encrypted. Keep it private.'); }
  const name = 'listen-up-backup-' + new Date().toISOString().slice(0, 10) + '.json', t = JSON.stringify(body);
  if (saveFile(name, t, 'application/json')) { say('✅ Encrypted backup saved: ' + name); return; }
  if (navigator.share) { navigator.share({ title: name, text: t }).then(() => say('✅ Backup shared.'), () => copyText(t).then(() => say('Backup copied — paste it into a note or e-mail and keep it.'))); return; }
  copyText(t).then(() => say('Backup copied — paste it into a note or e-mail and keep it.'), () => say('Could not save the backup here.'));
}
function restoreFlow() {
  const m = sheet(`<h3>♻️ Restore a backup <span class="ar">استعادة نسخة احتياطية</span></h3><p>Choose a backup file, or paste the backup text. <b>This replaces all accounts and progress on this device.</b></p><p class="ar ar-block">اختر ملف النسخة الاحتياطية أو الصق نصّها. سيحلّ ذلك محلّ جميع الحسابات والتقدّم على هذا الجهاز.</p>
    <input type="file" id="bkF" accept=".json,application/json,text/plain" style="margin:6px 0 10px"><textarea class="bk" id="bkT" placeholder='{"app":"listen-up-speak-out", …}'></textarea>
    <div id="bkPw" hidden>${pwField('bkP', 'Password of the teacher who made the backup', 'كلمة مرور المعلم الذي أنشأ النسخة')}</div>
    <p class="pinmsg bad" id="bkE" role="alert"></p><div class="navrow"><button class="btn sec" data-x>Cancel</button><button class="btn" data-ok>Restore</button></div>`);
  bindEyes(m); const ta = $('#bkT', m), E = $('#bkE', m);
  const parse = () => { try { return JSON.parse(ta.value.trim()); } catch (e) { return null; } };
  const look = () => { const o = parse(); $('#bkPw', m).hidden = !(o && o.enc); };
  $('#bkF', m).onchange = e => { const f = e.target.files[0]; if (f) f.text().then(t => { ta.value = t; look(); }); };
  ta.oninput = look; $('[data-x]', m).onclick = () => m.remove();
  $('[data-ok]', m).onclick = async () => {
    const o = parse(); if (!o || o.app !== 'listen-up-speak-out') { E.textContent = 'This is not a From Zero To Hero backup.'; return; }
    let data = o.data;
    if (o.enc) {
      if (!Sec.subtle()) { E.textContent = 'This browser cannot open encrypted backups. Use the app or Chrome/Edge.'; return; }
      try { data = JSON.parse(await Sec.open(o.enc, $('#bkP', m).value)); } catch (e) { E.innerHTML = 'Wrong password, or the backup is damaged. <span class="ar">كلمة مرور خاطئة أو ملف تالف.</span>'; return; }
    }
    if (!data || typeof data.profiles !== 'object') { E.textContent = 'This is not a From Zero To Hero backup.'; return; }
    const keepAuth = Store.data.auth;
    if (!(data.auth && data.auth.teacher)) data.auth = keepAuth;     // a backup from version 1.3 or older: keep this device's teacher account
    data.auth.fails = {}; Store.data = data; Store.save(); Store.load();
    Auth.start('teacher', 'teacher'); m.remove(); Upd.toast('✅ The backup was restored. <span class="ar">تمت الاستعادة.</span>'); go('settings');
  };
}

/* ---------- Bidi: keep English phrases inside Arabic text in the right order ---------- */
const LATRE = /[A-Za-z\/][A-Za-z0-9\/ '’\-…:ːˈɪʊəæʌɑɔɜθðʃʒŋ.?!]*[A-Za-z0-9\/ːɪʊəæʌɑɔɜθðʃʒŋ]/g;
function bidiFix(root) {
  $$('.ar:not([data-bx])', root).forEach(el => {
    el.dataset.bx = '1'; if (el.children.length) return;
    const t = el.textContent; let h = '', last = 0; t.replace(LATRE, (m, i) => { h += esc(t.slice(last, i)) + '<bdi dir="ltr">' + esc(m) + '</bdi>'; last = i + m.length; return m; });
    if (last) el.innerHTML = h + esc(t.slice(last));
  });
}
new MutationObserver(() => bidiFix(document)).observe(document.getElementById('app'), { childList: true, subtree: true });

/* ---------- Boot ---------- */
if (!D) { document.getElementById('app').innerHTML = '<div class="wrap"><p style="padding:40px">data.js is missing. Keep index.html, data.js and the audio folder together.</p></div>'; }
else { if (typeof MAPX !== "undefined") MAPX.register(); Store.load(); Cfg.apply(); Auth.idleCheck(true); render(); window.addEventListener('load', () => Upd.boot()); }
